name: Build macOS SuperLauncherMC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt6 requests tqdm pypresence random-username minecraft-launcher-lib packaging cryptography PyJWT Pillow psutil

      - name: Build SuperLauncherMC .app
        run: |
          pyinstaller \
            --noconsole \
            --windowed \
            --name "SuperLauncherMC" \
            main.py

      - name: Package .app into zip
        run: |
          cd dist
          zip -r SuperLauncherMC-mac.zip SuperLauncherMC.app

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: SuperLauncherMC-mac
          path: dist/SuperLauncherMC-mac.zip
