name: Build macOS SuperLauncherMC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt6 requests tqdm pypresence random-username \
                      minecraft-launcher-lib packaging cryptography \
                      PyJWT Pillow psutil pyinstaller

      - name: Build SuperLauncherMC .app (onefile)
        run: |
          pyinstaller \
            --noconsole \
            --windowed \
            --onefile \
            --name "SuperLauncherMC" \
            --add-data "assets:assets" \
            SuperLauncherMC.py

      - name: Package .app into zip
        run: |
          cd dist
          zip -r SuperLauncherMC-mac.zip SuperLauncherMC.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperLauncherMC-mac
          path: dist/SuperLauncherMC-mac.zip
